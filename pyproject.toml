# Core package and build configuration.
# `make install-core` installs the compiled library.
# `make install-dev` installs editable packages and test dependencies.
# The root Meson project compiles the Cython extensions.

[build-system]
requires = [
    "meson-python>=0.18",
    "meson>=1.3",
    "cython>=3.0",
    "numpy>=2.0",
]
build-backend = "mesonpy"

# Project metadata

[project]
name = "rexgraph"
version = "1.4.0"
description = "Relational complex (rex) graph analysis: edge-centric topological data analysis with Hodge decomposition"
readme = "README.md"
# SPDX, per PEP 639: "Apache License 2.0" is the name, not the identifier,
# and the table form is deprecated. Metadata 2.4 carries this as
# License Expression with the file itself bundled alongside.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "RexGraph"},
]
keywords = [
    "graph", "topology", "hodge", "laplacian", "spectral",
    "relational-complex", "network-analysis", "TDA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core dependencies
dependencies = [
    "numpy>=2.0",
    # Caps inner BLAS/OpenMP pools during compute.parallel_map calls so nested
    # parallelism (outer workers x inner BLAS) does not oversubscribe cores. Tiny,
    # Python only; the compute layer leaves pools uncapped without it.
    "threadpoolctl>=3.0",
]

# Optional dependency groups
[project.optional-dependencies]

# Explicit matrix exports, spectral references and older sparse analysis APIs.
# Native construction, exact channels, RCQL and record storage do not need this.
scipy = ["scipy>=1.13"]
oracles = ["scipy>=1.13"]

# I/O: Zarr, HDF5, Arrow, Parquet, SQL
io = [
    # Native tensor and model transport use this format independently of torch.
    "safetensors>=0.3",
    # Optional compression backend for framed store blobs. The standard
    # library zlib backend remains available when zstandard is absent.
    "zstandard>=0.21",
    "zarr>=2.14",
    "h5py>=3.11",
    "pyarrow>=16.0",
    "sqlalchemy>=2.0",
    "pandas>=2.2.2",
    "openpyxl>=3.1",  # Streaming declared XLSX records.
]

# Authenticated encryption and Ed25519 signing for native Rex artifacts.
security = [
    "cryptography>=42",
]

# rexgraph.nn - the differentiable ML substrate (GreensCochain, propagators, relational attention).
# Heavy: pulls torch. The numpy hodge_* core works without it.
nn = [
    "torch>=2.0",
    "scipy>=1.13",
]

# Molecular source interpretation through the optional RDKit adapter.
molecules = ["rdkit>=2025.9"]

# GPU acceleration. Heavy: pulls cupy and needs a CUDA toolkit.
cuda = [
    "cupy-cuda12x>=13.0",
]

vulkan = ["vulkan>=1.3.275.1", "scipy>=1.13"]

# TensorFlow support is separate from nn so its runtime can be selected
# independently. Builds that bundle conflicting LLVM or GPU runtimes must run
# in separate processes; test_tf_integration.py uses that isolation.
tf = [
    "tensorflow>=2.16",
]

# Contributor tooling: test, lint, type check, and the build backend.
dev = [
    "scipy>=1.13",  # The complete test suite includes explicit reference oracles.
    "pytest>=7.0",
    "tomli>=2.0; python_version < '3.11'",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "cython>=3.0",
    "meson>=1.3",
    "meson-python>=0.18",
    "ruff>=0.3",
    "mypy>=1.0",
    # Validate metadata classifiers locally before attempting distribution.
    "trove-classifiers>=2024.1.1",
]

# The lightweight runtime extras. nn (torch), cuda (GPU), and dev are separate
# opt ins so this stays small.
all = [
    "rexgraph[io,security]",
]

# URLs
[project.urls]
Homepage = "https://github.com/sirtrott1/rexgraph"
# The root README is the documentation entry point for source installations.
Documentation = "https://github.com/sirtrott1/rexgraph#readme"
Repository = "https://github.com/sirtrott1/rexgraph"
Issues = "https://github.com/sirtrott1/rexgraph/issues"

# Meson python: no extra arguments needed; meson.build default_options
# sets buildtype=release and b_lto=true.

# Testing
[tool.pytest.ini_options]
testpaths = ["rexgraph/tests"]
addopts = ["-v", "--tb=short"]
# PyTorch emits this deprecation from its own lazy mkldnn import. Match that
# message only so deprecations in our calls and other dependencies remain visible.
filterwarnings = [
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (run with --runslow)",
    "cuda: marks tests requiring CUDA (run with --cuda)",
    "benchmark: marks benchmark tests",
]

# Linting
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length: enforced by review, not by the linter
    "E701",   # `if x: return` and paired statements on one line, used throughout
    "E702",   # `a.append(x); b.append(y)`, the same compact style
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and request bodies as argument defaults, so the call in
# the default is the framework's interface rather than the mutable default bug B008 looks
# for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.File",
                          "fastapi.Query", "fastapi.Header", "fastapi.Form"]

# Type checking
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Wheel builds supply compiled extensions for these interpreter versions.
# A matching wheel avoids a local Cython build; source installs need the toolchain.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]

# The kernels target the CPython C API. This matrix covers glibc Linux, macOS
# and 64 bit Windows; musl and 32 bit builds need separate dependency qualification.
# The manylinux2014 i686 image lacks the OpenBLAS package used by this build.
skip = ["pp*", "*-musllinux_*", "*-win32", "*-manylinux_i686"]

# Run outside the checkout so source files cannot hide missing wheel members.
# The smoke test imports selected kernels individually and exercises character
# and exact operators; a Betti check alone would not reach BLAS linked modules.
test-command = "python {project}/agent/install/smoke_test.py"

[tool.cibuildwheel.linux]
# This image supplies the compiler used for C11 and link time optimization.
manylinux-x86_64-image = "manylinux_2_28"

# Supply BLAS/LAPACK for the cblas and LAPACK calls declared in _linalg.pxd.
# The build requires a linked provider so extension imports resolve their symbols.
before-all = "yum install -y openblas-devel || { apt-get update && apt-get install -y libopenblas-dev; }"

[tool.cibuildwheel.macos]
# Retain the deployment target used by the C11 and LTO wheel configuration.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

# Accelerate supplies the declared CBLAS/LAPACK symbols as a system framework.
# Avoid bundling Homebrew libraries built for a newer macOS than the wheel target;
# OpenMP is disabled here because its runtime has the same deployment constraint.
config-settings = "setup-args=-Dblas_provider=accelerate setup-args=-Dopenmp=disabled"

[tool.cibuildwheel.windows]
# MSVC, the compiler CPython on Windows is built with. --vsenv activates it; otherwise
# meson picks the MinGW gcc on the runner's PATH. The BLAS is the library of the
# scipy-openblas32 wheel, installed to a fixed directory so that meson and delvewheel
# name the same one, and delvewheel puts its DLL into the wheel.
before-all = "python -m pip install --target C:/scipy-openblas scipy-openblas32==0.3.34.237.0"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path C:/scipy-openblas/scipy_openblas32/lib -w {dest_dir} {wheel}"
config-settings = "setup-args=--vsenv setup-args=-Dblas_provider=scipy-openblas setup-args=-Dblas_dir=C:/scipy-openblas/scipy_openblas32/lib"
