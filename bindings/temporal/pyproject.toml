[build-system]
requires = ["scikit-build-core>=1.0", "cython>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rexgraph-temporal-bindings"
version = "0.2.0"
description = "Exact retained function and layer-product bindings for RexGraph"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "RexGraph"}]

[tool.scikit-build]
wheel.packages = ["rexgraph_temporal"]
build.tool-args = ["-j1"]

[tool.scikit-build.sdist.force-include]
"../cpp/cmake/CompanionReceipt.cmake" = "cmake/CompanionReceipt.cmake"
